<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double Pendulum</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e14;
      color: #ccc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #e0e0e0;
    }

    .canvases {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    canvas {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
    }

    .panel {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px 32px;
      align-items: flex-end;
      max-width: 860px;
      width: 100%;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label { color: #aaa; font-size: 12px; }

    input[type="number"] {
      width: 80px;
      background: #1e1e2e;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 4px 8px;
      font-size: 13px;
    }

    input[type="range"] { width: 120px; accent-color: #6699ff; }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .val { color: #99aaff; min-width: 28px; text-align: right; }

    button {
      background: #2a2a4a;
      border: 1px solid #4a4a7a;
      border-radius: 6px;
      color: #ccd;
      padding: 6px 18px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    button:hover { background: #3a3a6a; }

    #playPauseBtn {
      background: #1e3a5f;
      border-color: #3a6a9a;
      min-width: 96px;
    }
    #playPauseBtn:hover { background: #2a4a7a; }

    .energy-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
      align-self: flex-end;
      margin-left: auto;
    }
    #energy { color: #88aaff; font-family: monospace; }

    .canvas-label {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: -12px;
    }
  </style>
</head>
<body>
  <h1>Double Pendulum</h1>

  <div class="canvases">
    <div>
      <canvas id="pendulumCanvas" width="420" height="440"></canvas>
      <p class="canvas-label">Pendulum</p>
    </div>
    <div>
      <canvas id="phaseCanvas" width="420" height="440"></canvas>
      <p class="canvas-label">Phase portrait &nbsp; θ₁ vs θ₂</p>
    </div>
  </div>

  <div class="panel">
    <div class="field">
      <label for="theta1">θ₁ initial (°)</label>
      <input type="number" id="theta1" value="120" min="-180" max="180" step="1" />
    </div>

    <div class="field">
      <label for="theta2">θ₂ initial (°)</label>
      <input type="number" id="theta2" value="-10" min="-180" max="180" step="1" />
    </div>

    <div class="field">
      <label>Simulation speed</label>
      <div class="field-row">
        <input type="range" id="speed" min="1" max="200" value="10" />
        <span class="val" id="speedLabel">10</span>
      </div>
    </div>

    <div class="field">
      <label>Pendulums</label>
      <div class="field-row">
        <input type="range" id="count" min="1" max="200" value="1" />
        <span class="val" id="countLabel">1</span>
      </div>
    </div>

    <div class="field">
      <label>Spread (°)</label>
      <div class="field-row">
        <input type="range" id="spread" min="0.001" max="10" step="0.001" value="0.1" />
        <span class="val" id="spreadLabel">0.1</span>
      </div>
    </div>

    <button id="playPauseBtn">▶  Play</button>
    <button id="resetBtn">Reset</button>

    <div class="energy-row">
      <span>Energy:</span>
      <span id="energy">—</span>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
