<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double Pendulum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #000000;
      --surface:      #0a0a0a;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text:         #ededed;
      --text-muted:   #666666;
      --text-dim:     #333333;
      --accent:       #ffffff;
    }

    html { height: 100%; }

    body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ───────────────────────────────────────────────────────────────── */
    #nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 16px;
      height: 48px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    #nav-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-right: 16px;
      white-space: nowrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 400;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
      position: relative;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 6px;
      right: 6px;
      height: 1px;
      background: var(--text);
      border-radius: 1px;
    }
    .tab-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Control bar ───────────────────────────────────────────────────────── */
    .ctrl-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      height: 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .ctrl-sep {
      width: 1px;
      height: 16px;
      background: var(--border-hover);
      flex-shrink: 0;
      margin: 0 4px;
    }

    .ctrl-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .ctrl-value {
      color: var(--text);
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      min-width: 20px;
    }

    .ctrl-spacer { flex: 1; min-width: 8px; }

    input[type="number"] {
      width: 56px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus { border-color: var(--border-hover); }
    input[type="number"]::-webkit-inner-spin-button { opacity: 0.3; }

    input[type="range"] {
      width: 80px;
      accent-color: var(--text);
      cursor: pointer;
    }

    select {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    select:focus { border-color: var(--border-hover); }
    select option { background: #111; color: var(--text); }

    button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      padding: 5px 12px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 400;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    button:hover { color: var(--text); border-color: var(--border-hover); background: rgba(255,255,255,0.04); }

    #playPauseBtn {
      color: var(--text);
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      min-width: 78px;
      font-weight: 500;
    }
    #playPauseBtn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }

    #energy {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Pendulum page ─────────────────────────────────────────────────────── */
    #page-pendulum {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #pendulum-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
    }

    .quad-cell {
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }

    .quad-cell canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .quad-label {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      pointer-events: none;
      z-index: 1;
      user-select: none;
    }

    /* ── Phase map page ────────────────────────────────────────────────────── */
    #page-phasemap {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    #phasemap-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      min-height: 0;
      overflow: hidden;
      padding: 24px;
    }

    #canvas-phasemap {
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1;
      width: auto;
      height: auto;
      border-radius: 4px;
    }

    #no-gpu-msg {
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 32px;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
      display: none;
      max-width: 360px;
    }
    #no-gpu-msg strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- ── Nav ── -->
  <nav id="nav">
    <span id="nav-title">Double Pendulum</span>
    <button class="tab-btn active" id="tab-pendulum">Pendulum</button>
    <button class="tab-btn" id="tab-phasemap">Phase Map</button>
  </nav>

  <!-- ── Page 1: Pendulum ── -->
  <div id="page-pendulum">

    <div class="ctrl-bar">
      <span class="ctrl-label">N</span>
      <input type="number" id="numPendulums" value="5" min="1" max="50" step="1" />

      <span class="ctrl-label">Δ°</span>
      <input type="number" id="deltaAngle" value="1" min="0.01" max="45" step="0.1" />

      <div class="ctrl-sep"></div>

      <button id="playPauseBtn">⏸&thinsp;Pause</button>
      <button id="resetBtn">↺&thinsp;Reset</button>

      <div class="ctrl-sep"></div>

      <span class="ctrl-label">Show</span>
      <select id="showSelect"></select>

      <div class="ctrl-sep"></div>

      <span class="ctrl-label">Speed</span>
      <input type="range" id="speed" min="1" max="100" value="10" />
      <span class="ctrl-value" id="speedLabel">10</span>

      <div class="ctrl-spacer"></div>
      <span id="energy">—</span>
    </div>

    <div id="pendulum-grid">
      <div class="quad-cell">
        <span class="quad-label">Pendulum</span>
        <canvas id="canvas-pendulum"></canvas>
      </div>
      <div class="quad-cell">
        <span class="quad-label">Phase portrait  θ₁ vs θ₂</span>
        <canvas id="canvas-phase"></canvas>
      </div>
      <div class="quad-cell">
        <canvas id="canvas-t1"></canvas>
      </div>
      <div class="quad-cell">
        <canvas id="canvas-t2"></canvas>
      </div>
    </div>

  </div>

  <!-- ── Page 2: Phase Map ── -->
  <div id="page-phasemap">

    <div class="ctrl-bar">
      <span class="ctrl-label">Resolution</span>
      <select id="mapRes">
        <option value="10">10 × 10</option>
        <option value="25">25 × 25</option>
        <option value="50">50 × 50</option>
        <option value="100" selected>100 × 100</option>
        <option value="200">200 × 200</option>
        <option value="400">400 × 400</option>
        <option value="600">600 × 600</option>
      </select>

      <div class="ctrl-sep"></div>

      <span class="ctrl-label">Mode</span>
      <select id="mapMode">
        <option value="flipTime">Flip time</option>
        <option value="theta2">Live θ₂</option>
      </select>

      <div class="ctrl-sep"></div>

      <span class="ctrl-label">Speed</span>
      <input type="range" id="mapSpeed" min="1" max="50" value="10" />
      <span class="ctrl-value" id="mapSpeedLabel">10</span>

      <div class="ctrl-spacer"></div>
      <button id="mapResetView">Reset view</button>
    </div>

    <div id="phasemap-wrap">
      <canvas id="canvas-phasemap"></canvas>
      <div id="no-gpu-msg">
        <strong>WebGPU unavailable</strong>
        Phase Map requires Chrome 113+ or another WebGPU-enabled browser.
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
