<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double Pendulum</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
    }

    body {
      height: 100%;
      width: 100%;
      background: #0e0e14;
      color: #ccc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────────────────────── */
    #toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      background: #111118;
      border-bottom: 1px solid #2a2a3a;
      flex-wrap: wrap;
    }

    #toolbar h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #dde;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tb-label { color: #888; font-size: 11px; }

    input[type="number"] {
      width: 68px;
      background: #1e1e2e;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 3px 6px;
      font-size: 12px;
    }
    input[type="range"] { width: 100px; accent-color: #6699ff; }
    select {
      background: #1e1e2e;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 3px 6px;
      font-size: 12px;
    }

    button {
      background: #2a2a4a;
      border: 1px solid #4a4a7a;
      border-radius: 5px;
      color: #ccd;
      padding: 4px 14px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.12s;
    }
    button:hover { background: #3a3a6a; }
    button:disabled { opacity: 0.45; cursor: default; }

    #playPauseBtn { background: #1e3a5f; border-color: #3a6a9a; min-width: 88px; }
    #playPauseBtn:hover { background: #2a4a7a; }

    #addPaneBtn { background: #1e3a22; border-color: #3a7a44; }
    #addPaneBtn:hover { background: #2a5a30; }

    .energy-row { color: #888; font-size: 11px; }
    #energy { color: #88aaff; font-family: monospace; }

    .tb-spacer { flex: 1; }

    /* ── Pane grid ───────────────────────────────────────────────────── */
    #paneContainer {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      overflow: hidden;
      align-content: flex-start;
    }

    .pane-wrapper {
      flex: 1 1 calc(50% - 3px);
      min-width: 260px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      overflow: hidden;
    }

    .pane-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #1a1a28;
      border-bottom: 1px solid #2a2a3a;
      font-size: 11px;
      color: #888;
      min-height: 32px;
    }

    .pane-title { font-weight: 500; color: #aaa; white-space: nowrap; }

    .pane-header-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #777;
      flex-wrap: wrap;
    }
    .pane-header-controls select,
    .pane-header-controls input[type="range"] { width: 80px; }
    .pane-header-controls span { color: #88aaff; }

    .pane-ctrl-btn {
      padding: 2px 8px;
      font-size: 11px;
      background: #2a2a4a;
      border-color: #4a4a7a;
    }

    .pane-close {
      margin-left: auto;
      flex-shrink: 0;
      padding: 2px 7px;
      font-size: 13px;
      background: transparent;
      border: none;
      color: #666;
      cursor: pointer;
      border-radius: 3px;
      line-height: 1;
    }
    .pane-close:hover { background: #3a1a1a; color: #f88; }

    .pane-body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .pane-body canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── +Pane dialog ────────────────────────────────────────────────── */
    #addPaneDialog {
      background: #1a1a28;
      border: 1px solid #3a3a5a;
      border-radius: 10px;
      color: #ccc;
      padding: 20px 24px;
      min-width: 260px;
    }
    #addPaneDialog::backdrop { background: rgba(0,0,0,0.6); }

    #addPaneDialog h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 14px;
      color: #dde;
    }

    .pane-picker {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pane-picker button {
      text-align: left;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
    }
    .pane-picker button:hover { background: #2a3a5a; border-color: #4a6a9a; }

    #closeDialog {
      margin-top: 8px;
      background: transparent;
      border-color: #3a3a5a;
      color: #888;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <h1>Double Pendulum</h1>

    <div class="tb-group">
      <span class="tb-label">θ₁ (°)</span>
      <input type="number" id="theta1" value="120" min="-180" max="180" step="1" />
      <span class="tb-label">θ₂ (°)</span>
      <input type="number" id="theta2" value="-10" min="-180" max="180" step="1" />
      <button id="setProbeBtn">Set</button>
    </div>

    <div class="tb-group">
      <button id="playPauseBtn">⏸  Pause</button>
    </div>

    <div class="tb-group">
      <span class="tb-label">Speed</span>
      <input type="range" id="speed" min="1" max="100" value="10" />
      <span id="speedLabel" style="color:#99aaff;min-width:22px">10</span>
    </div>

    <div class="tb-spacer"></div>

    <div class="energy-row">E: <span id="energy">—</span></div>

    <button id="addPaneBtn">+ Pane</button>
  </div>

  <div id="paneContainer"></div>

  <dialog id="addPaneDialog">
    <h3>Add Pane</h3>
    <div class="pane-picker">
      <button data-pane-type="pendulum">🔵  Pendulum animation</button>
      <button data-pane-type="phasePortrait">📈  Phase portrait  θ₁ vs θ₂</button>
      <button data-pane-type="phaseMap">🌈  Phase map  (WebGPU)</button>
      <button data-pane-type="timeSeries">📉  Time series  θ(t)</button>
      <button id="closeDialog">Cancel</button>
    </div>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
